name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint source
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:ci

      # Expo's production dependency tree can temporarily contain upstream
      # high-severity advisories in CLI/build tooling that this application
      # does not execute at runtime. Keep those advisories visible in the log,
      # while still failing CI immediately if a critical advisory appears.
      - name: Report production dependency advisories
        continue-on-error: true
        run: npm audit --omit=dev

      - name: Block critical dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=critical

      - name: Verify production web bundle
        run: npx expo export --platform web
