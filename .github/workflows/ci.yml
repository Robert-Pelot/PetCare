name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint source
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:ci

      - name: Check for high-severity dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Verify production web bundle
        run: npx expo export --platform web
